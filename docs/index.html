<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>goalcalendar – Demo</title>

    <!-- Load CSS from the published package output (built in dist/) -->
    <link rel="stylesheet" href="./assets/goalcalendar/style.css" />
    <link rel="stylesheet" href="./assets/goalcalendar/modern.css" />

    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        margin: 0;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      .sub {
        margin: 6px 0 0;
        color: #475569;
        font-size: 13px;
        line-height: 1.4;
      }
      .card {
        background: white;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 980px) {
        .grid {
          grid-template-columns: 340px 1fr;
        }
      }
      label {
        display: block;
        font-size: 12px;
        color: #334155;
        margin-bottom: 6px;
      }
      select,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: #fff;
        font-size: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .btn {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: #0f172a;
        color: #fff;
        font-weight: 600;
      }
      .btn.secondary {
        background: #fff;
        color: #0f172a;
      }
      .btns {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: #64748b;
      }
      .links a {
        color: #0f172a;
      }
      .links {
        font-size: 13px;
        color: #334155;
      }
      code {
        background: #f1f5f9;
        padding: 2px 6px;
        border-radius: 6px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
          'Courier New', monospace;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>goalcalendar – Demo</h1>
          <p class="sub">
            A small, dependency-free calendar library. This page is hosted on GitHub Pages. Usage
            docs: <a href="./usage.html">usage</a>
          </p>
        </div>
        <div class="links">
          <div>
            <a href="https://github.com/DanielFang71/Goal_Caldendar_Library" target="_blank" rel="noreferrer"
              >GitHub Repo</a
            >
          </div>
          <div>
            <a href="https://www.npmjs.com/package/goalcalendar" target="_blank" rel="noreferrer">NPM</a>
          </div>
          <div>
            <a href="./compatibility.html">Compatibility</a>
          </div>
        </div>
      </header>

      <div class="grid">
        <div class="card">
          <div class="row">
            <div>
              <label for="size">Size</label>
              <select id="size">
                <option value="small">small</option>
                <option value="medium">medium</option>
                <option value="large" selected>large</option>
              </select>
            </div>
            <div>
              <label for="startOfWeek">Start of week</label>
              <select id="startOfWeek">
                <option value="Monday" selected>Monday</option>
                <option value="Sunday">Sunday</option>
              </select>
            </div>
          </div>

          <div style="height: 12px"></div>

          <div class="row">
            <div>
              <label for="labelLength">Label length</label>
              <select id="labelLength">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
              </select>
            </div>
            <div>
              <label for="theme">Theme</label>
              <select id="theme">
                <option value="classic">classic</option>
                <option value="modern" selected>modern</option>
              </select>
            </div>
          </div>

          <div class="btns">
            <button class="btn" id="rebuild">Rebuild</button>
            <button class="btn secondary" id="seed">Seed data</button>
            <button class="btn secondary" id="clear">Clear</button>
            <button class="btn secondary" id="applyJson">Apply JSON</button>
          </div>

          <div style="height: 12px"></div>

          <label for="json">Data (JSON)</label>
          <textarea id="json" rows="10"></textarea>

          <div class="hint">
            Tip: DayItem is <code>{ text, complete, goal }</code>. Click any day cell to change the
            selected date.
          </div>
        </div>

        <div class="card">
          <div id="calendarContainer" class="calendarHost"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import Calendar from './assets/goalcalendar/index.mjs'

      const container = document.getElementById('calendarContainer')
      const jsonEl = document.getElementById('json')
      let cal

      function clearContainer() {
        container.innerHTML = ''
      }

      function setJson(obj) {
        if (!jsonEl) return
        jsonEl.value = JSON.stringify(obj, null, 2)
      }

      function build() {
        clearContainer()
        container.id = 'demo-cal'

        const size = document.getElementById('size').value
        const startOfWeek = document.getElementById('startOfWeek').value
        const labelLength = Number(document.getElementById('labelLength').value)
        const theme = document.getElementById('theme').value

        container.classList.toggle('goalcal-theme-modern', theme === 'modern')

        cal = new Calendar({
          containerId: container.id,
          size,
          startOfWeek,
          labelLength,
          theme,
        })
      }

      function seedData() {
        if (!cal || typeof cal.setData !== 'function') return

        const now = new Date()
        const y = now.getFullYear()
        const m = String(now.getMonth() + 1).padStart(2, '0')
        const d = String(now.getDate()).padStart(2, '0')

        const data = {
          [`${y}-${m}-${d}`]: [
            { text: 'Today: Gym', complete: 1, goal: 1 },
            { text: 'Today: Read', complete: 1, goal: 2 },
          ],
          [`${y}-${m}-01`]: [{ text: 'Kickoff', complete: 2, goal: 3 }],
          [`${y}-${m}-05`]: [{ text: 'Gym', complete: 1, goal: 1 }],
          [`${y}-${m}-12`]: [
            { text: 'Study', complete: 0, goal: 2 },
            { text: 'Read', complete: 1, goal: 2 },
          ],
        }

        cal.setData(data)
        setJson(data)
      }

      function clearData() {
        if (!cal || typeof cal.setData !== 'function') return
        cal.setData({})
        setJson({})
      }

      function applyJson() {
        if (!cal || typeof cal.setData !== 'function') return
        try {
          const parsed = JSON.parse(jsonEl.value || '{}')
          cal.setData(parsed)
        } catch (e) {
          alert('Invalid JSON: ' + e.message)
        }
      }

      document.getElementById('rebuild').addEventListener('click', build)
      document.getElementById('seed').addEventListener('click', seedData)
      document.getElementById('clear').addEventListener('click', clearData)
      document.getElementById('applyJson').addEventListener('click', applyJson)

      build()
      setJson({})
    </script>
  </body>
</html>
