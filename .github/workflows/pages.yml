name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site

          # Use the legacy static demo pages (previously served via express).
          # This guarantees click behavior and the original water-fill visuals.
          cp -R pub/* _site/

          # Also include the new docs site under /docs for reference.
          mkdir -p _site/docs
          cp -R docs/* _site/docs/

          # Provide the built package assets as well (for module-based demos).
          mkdir -p _site/assets/goalcalendar
          cp dist/index.mjs dist/index.js dist/index.d.ts dist/style.css dist/modern.css _site/assets/goalcalendar/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
